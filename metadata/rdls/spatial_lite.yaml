# =============================================================================
# Spatial Configuration (Lite) — Country Name Fixes Only
# =============================================================================
# Subset of spatial.yaml containing only the country_name_fixes needed
# by the ICRA record generator. Region mappings are omitted.
# =============================================================================

# ---------------------------------------------------------------------------
# Common country name fixes -> ISO3 code
# Maps non-standard country names to their ISO 3166-1 alpha-3 codes.
# Keys should be lowercase.
# ---------------------------------------------------------------------------
