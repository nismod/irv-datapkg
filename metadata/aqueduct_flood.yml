# yaml-language-server: $schema=irv-datapkg-schema.json
name: aqueduct_flood
description: WRI Aqueduct Floods
version: "2"
dataset_name: aqueduct_flood
data_title: Aqueduct Flood Hazard Maps
data_title_long: World Resource Institute - Aqueduct Flood Hazard Maps (Version 2, updated October 20, 2020)
data_author: Ward, P.J., H.C. Winsemius, S. Kuzma, M.F.P. Bierkens, A. Bouwman, H. de Moel, A. Díaz Loaiza, et al.
data_summary: >
  World Resource Institute - Aqueduct Flood Hazard Maps (Version 2 (updated
  October 20, 2020)).  Inundation depth in meters for coastal and riverine
  floods over 1km grid squares. 1 in 2 to 1 in 1000 year return periods.
  Baseline, RCP 4.5 & 8.5 emission scenarios. Current and future maps in 2030,
  2050 and 2080
data_citation: >
  Ward, P.J., H.C. Winsemius, S. Kuzma, M.F.P. Bierkens, A. Bouwman, H. de Moel, A. Díaz Loaiza, et al. 2020.
  Aqueduct Floods Methodology. Technical Note. Washington, D.C.: World Resources Institute. Available online at:
  www.wri.org/publication/aqueduct-floods-methodology.
data_license:
  name: CC-BY-4.0
  title: Creative Commons Attribution 4.0
  path: https://creativecommons.org/licenses/by/4.0/

data_origin_url: http://wri-projects.s3.amazonaws.com/AqueductFloodTool/download/v2/index.html
data_formats: ["GeoTIFF"]

# T1: STAC collection(s) published by this recipe (see docs/recipes.md)
collections:
  - id: aqueduct_flood
    version: v2-r1
    upstream_url: s3://wri-projects/AqueductFloodTool/download/v2
    upstream_version: v2
    license: CC-BY-4.0
    access: public
    units: m
    dimensions: [hazard, rcp, epoch, gcm, return_period, subsidence, sea_level_rise]
    keywords: [flood, hazard, inundation, climate]
    processing:
      - mirror every GeoTIFF in the upstream bucket (aws s3 sync --no-sign-request)
      - convert each GeoTIFF to a COG (ZSTD + predictor, 512 px tiles, overviews), source grid kept
      - variant properties (hazard, rcp, epoch, gcm, return period, subsidence, sea level rise) parsed once from upstream file names

# T2: per-country extracts (Zenodo packages)
t2:
  enabled: true
  stem: "{upstream_name}"
  # as before: no "nosub" (incl. coastal baseline), sea-level-rise percentile or 1.5 degree variants
  exclude_patterns: [nosub, perc, "1_5"]
  summary: true
  summary_columns: [hazard, epoch, rcp, gcm, return_period]
  baseline_epoch: 2010
