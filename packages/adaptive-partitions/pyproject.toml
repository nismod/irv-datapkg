[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-partitions"
version = "0.1.0"
description = "Population-balanced adaptive spatial partition keys (geographic quadkey and H3) for Hive-partitioned GeoParquet"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "shapely>=2.0",
    "pyproj>=3.5",
    "geopandas>=1.0",
    "pyarrow>=14",
    "rasterio>=1.3",
    "h3>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
adaptive-partitions = "adaptive_partitions.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
