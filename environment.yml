name: datapkg
channels:
  - nodefaults
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - zenodo_get>=1.6.1 # download from Zenodo
      - cdsapi>=0.7.2 # copernicus data api
      - -e . # irv_datapkg helper
  - awscli # connect to AWS, download from S3
  - black # Python formatting
  - gdal>=3.9 # command-line tools for spatial data
  - libgdal-arrow-parquet # ogr2ogr -f Parquet (OSM GeoParquet)
  - libgdal-netcdf # NetCDF to COG
  - parallel # parallel tile downloads (Copernicus DEM)
  - geopandas>=1.0.1 # geospatial dataframes
  - osmium-tool # openstreetmap extracts
  - pyyaml # read YAML files
  - pyogrio # faster geospatial i/o
  - rasterio>=1.3 # windowed raster reads for the catalogue client
  - pyarrow # GeoParquet
  - fsspec # catalogue access over local, s3 and https roots
  - s3fs # fsspec s3:// support
  - aiohttp # fsspec https:// support
  - click # irv-datapkg command line
  - jsonschema # catalogue validation
  - pytest # tests
  - bioconda::snakemake # workflow management
  - bioconda::snakefmt # Snakefile formatting
